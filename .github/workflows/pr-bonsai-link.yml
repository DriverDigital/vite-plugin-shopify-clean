name: Bonsai task link

# Checks the Bonsai task link in a PR body: a PR that mentions no Bonsai link at all is skipped
# (grey, never red — most human PRs have no ticket), one that carries a link must carry a task URL.

on:
  pull_request:
    # synchronize/reopened as well: a required check belongs to the head SHA, so without them a push
    # leaves the new head waiting on a check that never runs.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  bonsai-link:
    # Skipped is the neutral outcome: no Bonsai mention, nothing to check. The regex below is the
    # precise test; this is only the coarse gate that keeps the job grey instead of red.
    if: contains(github.event.pull_request.body, 'hellobonsai.com')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR body names its Bonsai task
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}([^0-9a-z]|$)'
          # A task URL (/tasks/<uuid>, or the board form ?task=<uuid>), or a `Bonsai task: none` line.
          url="(^|https?://|[^[:alnum:]./-])app\.hellobonsai\.com/(tasks/|[^[:space:]]*[?&]task=)$uuid"
          none='^[[:space:]>*_-]*Bonsai task:[[:space:]*_`]*none([^[:alnum:]]|$)'
          if grep -qiE "$url|$none" <<<"$BODY"; then
            echo "Bonsai task named"; exit 0
          fi
          echo "::error::The Bonsai link in the PR body is not a task URL. Use the task's app.hellobonsai.com/tasks/<uuid> URL (or its board link with ?task=<uuid>)."
          exit 1
