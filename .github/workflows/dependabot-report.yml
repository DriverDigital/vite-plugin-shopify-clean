name: Dependabot report

# Caller stub: after Dependabot validate completes, the privileged reusable reads its build log,
# posts a verdict and requests a reviewer. The run context goes in as inputs because the reusable's
# provenance check is written against them.

on:
  workflow_run:
    workflows: ["Dependabot validate"] # must equal the validate stub's name: exactly
    types: [completed]

permissions:
  pull-requests: write
  actions: read

concurrency:
  group: dependabot-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    uses: DriverDigital/workflows/.github/workflows/dependabot-report.yml@85f15787eb053ff0063b2588fd5ce4cd6ead5d33 # v1.18.0
    with:
      triggering-run-id: ${{ github.event.workflow_run.id }}
      head-repository: ${{ github.event.workflow_run.head_repository.full_name }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      validate-conclusion: ${{ github.event.workflow_run.conclusion }}
      workflow-event: ${{ github.event.workflow_run.event }}
      triggering-actor: ${{ github.event.workflow_run.actor.login }}
    secrets: inherit
