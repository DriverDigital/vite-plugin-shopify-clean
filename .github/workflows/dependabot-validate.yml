name: Dependabot validate

# Caller stub: installs, builds and tests Dependabot PRs with no credentials, since that code is
# untrusted. Keep the name above byte-identical: dependabot-report's workflow_run matches on it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: DriverDigital/workflows/.github/workflows/dependabot-validate.yml@359505a78bea40cd6055ea5c933d7aff63a733cc # v1.17.0
    # No secrets: line; this job runs untrusted code.
