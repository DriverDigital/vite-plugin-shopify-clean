name: Dependabot keep current

# Caller stub: rebases open Dependabot PRs left out of date when a merge lands on their base. It
# acts only where branch protection requires up-to-date branches, and covers every base branch.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  keep-current:
    uses: DriverDigital/workflows/.github/workflows/dependabot-keep-current.yml@b6a6f8dc61fbe8bcfc71d21878d5577051774a6f # v1.19.0
    secrets:
      AGENTS_GH_PAT: ${{ secrets.AGENTS_GH_PAT }}
