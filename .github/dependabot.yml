# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keep npm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # TS 7 is outside @typescript-eslint's peer range and breaks npm ci; drop once it isn't (#103).
    # Vitest 5 drops Node 20, which CI and engines still cover; drop with the Node move (#109).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    # Raise all npm pull requests with assignees
    assignees:
      - "mcarter-astronautdev"
    groups:
      # Group all npm updates into a single pull request
      dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Raise all GitHub Actions pull requests with assignees
    assignees:
      - "mcarter-astronautdev"
    groups:
      # Group all GitHub Actions updates into a single pull request
      actions:
        patterns:
          - "*"
